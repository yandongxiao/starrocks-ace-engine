# StarRocks ACE Engine — rewritten for the ACE spec as actually served by the live AWC hub
# (ecosystem.awc.cloudera.com/v1alpha10, observed 2026-09-02 on Cloudera's own published
# artifacts). The original ../engine.yaml is v1alpha9 and templates Flux HelmRepository /
# HelmRelease by hand; v1alpha10 installs Helm charts natively through spec.releases, which is
# how every Cloudera engine in the marketplace does it (see engines/valkey-engine:5.4.9).
#
# Differences from ../engine.yaml, in order of appearance:
#   - apiVersion v1alpha9 -> v1alpha10
#   - versionCatalog[].imageCatalog/chartCatalog -> top-level spec.imageCatalog / spec.chartCatalog
#   - configSchema gains `imagePullSecret` (images are pulled from a private registry now)
#   - the Flux HelmRepository + HelmRelease leave the template; spec.releases[] replaces them
#   - healthChecks dropped: none of Cloudera's v1alpha10 engines declare one, ace-operator tracks
#     the release it created itself (inference, to be confirmed at first deploy)
#   - the template keeps only the two objects the chart does not create: AuthConfig, HTTPRoute
apiVersion: ecosystem.awc.cloudera.com/v1alpha10
kind: Engine
metadata:
  name: starrocks-ace-engine
spec:
  displayName: "StarRocks ACE Engine"
  description: "Deploys a minimal StarRocks cluster (1 FE + 1 BE) via the kube-starrocks Helm chart"

  provides:
    - name: starrocksLandingPage
      capability: landing-page
      value: |
        url: "https://{{ .Metadata.Name }}.{{ .Cluster.DomainName }}"
    - name: starrocksCluster
      capability: starrocks-cluster
      value: |
        queryEndpoint:
          host: "{{ .Metadata.Name }}-fe-service.{{ .Metadata.Namespace }}.svc.cluster.local"
          port: 9030
        httpEndpoint:
          host: "{{ .Metadata.Name }}-fe-service.{{ .Metadata.Namespace }}.svc.cluster.local"
          port: 8030

  configSchema:
    type: object
    properties:
      feReplicas:
        type: integer
        minimum: 1
        default: 1
        title: FE Replicas
        description: "Number of FE (Frontend) replicas"
      beReplicas:
        type: integer
        minimum: 1
        default: 1
        title: BE Replicas
        description: "Number of BE (Backend) replicas"
      feCpu:
        type: string
        default: "2"
        title: FE CPU
        description: "CPU request and limit for each FE pod"
        pattern: '^([0-9]+m|[0-9]+(\.[0-9]+)?)$'
      feMemory:
        type: string
        default: "4Gi"
        title: FE Memory
        description: "Memory request and limit for each FE pod"
        pattern: '^[0-9]+(\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|k|m)?$'
      feMetaStorageSize:
        type: string
        default: "10Gi"
        title: FE Metadata Storage
        description: "Persistent volume size for FE metadata"
        pattern: '^[0-9]+(\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|k|m)?$'
      feLogStorageSize:
        type: string
        default: "5Gi"
        title: FE Log Storage
        description: "Persistent volume size for FE logs"
        pattern: '^[0-9]+(\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|k|m)?$'
      beCpu:
        type: string
        default: "2"
        title: BE CPU
        description: "CPU request and limit for each BE pod"
        pattern: '^([0-9]+m|[0-9]+(\.[0-9]+)?)$'
      beMemory:
        type: string
        default: "4Gi"
        title: BE Memory
        description: "Memory request and limit for each BE pod"
        pattern: '^[0-9]+(\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|k|m)?$'
      beStorageSize:
        type: string
        default: "20Gi"
        title: BE Data Storage
        description: "Persistent volume size for BE data storage"
        pattern: '^[0-9]+(\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|k|m)?$'
      beLogStorageSize:
        type: string
        default: "1Gi"
        title: BE Log Storage
        description: "Persistent volume size for BE logs"
        pattern: '^[0-9]+(\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|k|m)?$'
      imagePullSecret:
        type: string
        default: "awc-console-registry-creds"
        title: Image Pull Secret
        description: "Name of the docker-registry Secret, in the instance namespace, that holds the credentials for the private image registry. AWC's reflector propagates awc-console-registry-creds into every instance namespace; change this only if your environment names it differently."

  imageCatalog: starrocks-ace-images-1-11-4
  chartCatalog: starrocks-ace-charts-1-11-4

  releases:
    - chartID: kubeStarrocks
      values: |
        operator:
          nameOverride: "{{ .Metadata.Name }}"
          starrocksOperator:
            enabled: true
            image:
              repository: "{{ .Image.starrocksOperator.registry }}/{{ .Image.starrocksOperator.repository }}"
              tag: "{{ .Image.starrocksOperator.tag }}"
            imagePullSecrets:
              - name: "{{ .Config.imagePullSecret }}"
        starrocks:
          nameOverride: "{{ .Metadata.Name }}"
          starrocksCluster:
            name: "{{ .Metadata.Name }}"
          starrocksFESpec:
            replicas: {{ .Config.feReplicas }}
            image:
              repository: "{{ .Image.fe.registry }}/{{ .Image.fe.repository }}"
              tag: "{{ .Image.fe.tag }}"
            imagePullSecrets:
              - name: "{{ .Config.imagePullSecret }}"
            resources:
              requests:
                cpu: "{{ .Config.feCpu }}"
                memory: "{{ .Config.feMemory }}"
              limits:
                cpu: "{{ .Config.feCpu }}"
                memory: "{{ .Config.feMemory }}"
            storageSpec:
              name: fe
              storageSize: "{{ .Config.feMetaStorageSize }}"
              logStorageSize: "{{ .Config.feLogStorageSize }}"
          starrocksBeSpec:
            replicas: {{ .Config.beReplicas }}
            image:
              repository: "{{ .Image.be.registry }}/{{ .Image.be.repository }}"
              tag: "{{ .Image.be.tag }}"
            imagePullSecrets:
              - name: "{{ .Config.imagePullSecret }}"
            resources:
              requests:
                cpu: "{{ .Config.beCpu }}"
                memory: "{{ .Config.beMemory }}"
              limits:
                cpu: "{{ .Config.beCpu }}"
                memory: "{{ .Config.beMemory }}"
            storageSpec:
              name: be
              storageSize: "{{ .Config.beStorageSize }}"
              logStorageSize: "{{ .Config.beLogStorageSize }}"
      install:
        remediation:
          retries: 3
      upgrade:
        remediation:
          retries: 3

  # Only what the chart does not create: mesh auth policy and the Gateway API route for the FE UI.
  template: |
    apiVersion: security.awc.cloudera.com/v1alpha1
    kind: AuthConfig
    metadata:
      name: default
    spec:
      meshMode: Ambient
      enableAWCAuth: false
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: {{ .Metadata.Name }}-fe-http
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: default-awc
          namespace: istio-ingress
      hostnames:
        - "{{ .Metadata.Name }}.{{ .Cluster.DomainName }}"
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - group: ""
              kind: Service
              name: {{ .Metadata.Name }}-fe-service
              port: 8030
